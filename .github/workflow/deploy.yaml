name: Deploy EMR-API Docker App to DigitalOcean Droplet

on:
  workflow_dispatch:
    inputs:
      name:
        description: "Deploy EMR-API from dev"
        default: "dev"

env:
  DIGITALOCEAN_REGION: nyc1
  DIGITALOCEAN_SIZE: s-1vcpu-1gb
  DIGITALOCEAN_IMAGE: ubuntu-22-04-x64
  DROPLET_NAME: emrapi
  DOCKER_REGISTRY: registry.digitalocean.com/your-registry 
  DOCKER_REPOSITORY: api
  SSH_PORT: 22
  APP_PORT: 5000
  CONTAINER_NAME: emrapi
  DOMAIN_NAME: 
 

jobs:
  deploy:
    name: Deploy to DigitalOcean Droplet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Get or Create DigitalOcean Droplet
        id: droplet
        run: |
          DROPLET_ID=$(doctl compute droplet list --format ID,Name --no-header | awk '$2 == "${{ env.DROPLET_NAME }}" {print $1}')
          if [ -z "$DROPLET_ID" ]; then
            echo "Creating Droplet..."
            DROPLET_ID=$(doctl compute droplet create ${{ env.DROPLET_NAME }} --region ${{ env.DIGITALOCEAN_REGION }} --size ${{ env.DIGITALOCEAN_SIZE }} --image ${{ env.DIGITALOCEAN_IMAGE }} --format ID --no-header)
            echo "Waiting for Droplet to become active..."
            sleep 60 # Give time to droplet become available
          else
            echo "Droplet exists: $DROPLET_ID"
          fi

          DROPLET_IP=$(doctl compute droplet get $DROPLET_ID --format 'networks.v4.0.ip_address' --no-header)
          echo "DROPLET_IP=$DROPLET_IP" >> $GITHUB_ENV
          echo "DROPLET_ID=$DROPLET_ID" >> $GITHUB_ENV

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.DROPLET_SSH_PRIVATE_KEY }}

      - name: Install Docker & Certbot on Droplet
        run: |
          ssh -o StrictHostKeyChecking=no root@${{ env.DROPLET_IP }} "
            apt-get update -y &&
            apt-get install -y docker.io docker-compose nginx certbot python3-certbot-nginx &&
            usermod -aG docker root &&
            systemctl enable docker &&
            systemctl start docker
          "

      - name: Login to DigitalOcean Container Registry
        run: doctl registry login --expiry-seconds 600

      - name: Build and Push Docker Image
        run: |
          IMAGE_TAG=${{ github.sha }}
          docker build -t ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REPOSITORY }}:$IMAGE_TAG .
          docker push ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REPOSITORY }}:$IMAGE_TAG
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Deploy to Droplet
        run: |
          ssh -o StrictHostKeyChecking=no root@${{ env.DROPLET_IP }} "
            docker stop ${{ env.CONTAINER_NAME }} || true &&
            docker rm ${{ env.CONTAINER_NAME }} || true &&
            docker pull ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REPOSITORY }}:${{ env.IMAGE_TAG }} &&
            docker run -d --name ${{ env.CONTAINER_NAME }} -p ${{ env.APP_PORT }}:${{ env.APP_PORT }} --env-file /root/.env ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REPOSITORY }}:${{ env.IMAGE_TAG }
          "

      - name: Copy .env file
        run: |
          echo "${{ secrets.DATABASE }}" > .env
          echo "MYSQL_HOST=${{ secrets.HOST }}" >> .env
          echo "MYSQL_USER=${{ secrets.USER }}" >> .env
          echo "MYSQL_PASSWORD=${{ secrets.PASSWORD }}" >> .env
          echo "MYSQL_DB=${{ secrets.MYSQL_DB }}" >> .env
          echo "EXP_TIME=${{ secrets.EXP_TIME }}" >> .env
          echo "JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}" >> .env
          
      - name: Transfer .env file to Droplet
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ env.DROPLET_IP }}
          username: root
          key: ${{ secrets.DROPLET_SSH_PRIVATE_KEY }}
          port: ${{ env.SSH_PORT }}
          source: .env
          target: /root/.env
          strip_components: 0
        
      - name: Setup Systemd Service
        run: |
          ssh -o StrictHostKeyChecking=no root@${{ env.DROPLET_IP }} "
            cat << EOF > /etc/systemd/system/${{ env.CONTAINER_NAME }}.service

            [Unit]
            Description=EMR API Container
            After=network.target docker.service
            Requires=docker.service

            [Service]
            Restart=always
            ExecStartPre=-/usr/bin/docker stop ${{ env.CONTAINER_NAME }}
            ExecStartPre=-/usr/bin/docker rm ${{ env.CONTAINER_NAME }}
            ExecStart=/usr/bin/docker run --rm --name ${{ env.CONTAINER_NAME }} --env-file /root/.env -p ${{ env.APP_PORT }}:${{ env.APP_PORT }} ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REPOSITORY }}:${{ env.IMAGE_TAG }}
            ExecStop=/usr/bin/docker stop ${{ env.CONTAINER_NAME }}

            [Install]
            WantedBy=multi-user.target
            EOF

            systemctl daemon-reload && systemctl enable ${{ env.CONTAINER_NAME }} && systemctl start ${{ env.CONTAINER_NAME }} "

      - name: Setup Nginx Reverse Proxy
        run: |
              ssh -o StrictHostKeyChecking=no root@${{ env.DROPLET_IP }} "
                cat << EOF > /etc/nginx/sites-available/emrapi
                server {
                    listen 80;
                    server_name ${{ env.DOMAIN_NAME }};

                    location / {
                        proxy_pass http://localhost:5000;
                        proxy_set_header Host \$host;
                        proxy_set_header X-Real-IP \$remote_addr;
                        proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                        proxy_set_header X-Forwarded-Proto \$scheme;
                    }
                }
                EOF
                rm /etc/nginx/sites-enabled/default && ln -s /etc/nginx/sites-available/emrapi /etc/nginx/sites-enabled/ && nginx -t && systemctl restart nginx
              "

      - name: Setup Certbot (HTTPS)
        run: |
          ssh -o StrictHostKeyChecking=no root@${{ env.DROPLET_IP }} "
            certbot --nginx -d ${{ env.DOMAIN_NAME }} --non-interactive --agree-tos -m your-email@example.com
          "


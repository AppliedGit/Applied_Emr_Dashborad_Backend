name: Deploy EMR-API Docker App to DigitalOcean Droplet

on:
  workflow_dispatch:
    inputs:
      name:
        description: "Deploy EMR-API from dev"
        default: "dev"

env:
  DIGITALOCEAN_REGION: blr1
  DROPLET_SIZE: s-4vcpu-8gb
  DROPLET_IMAGE: ubuntu-22-04-x64
  DROPLET_NAME: emr-droplet
  DOCKER_REGISTRY: registry.digitalocean.com/emr-repository
  DOCKER_IMAGE: emrapi
  SSH_PORT: 22
  APP_PORT: 5000
  CONTAINER_NAME: emrapicontainer
  DOMAIN_NAME: emrapi.aaspl.net

jobs:
  deploy:
    name: Deploy to DigitalOcean Droplet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Authenticate with DigitalOcean
        run: doctl auth init --access-token ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Get or Create DigitalOcean Droplet
        id: droplet
        run: |
          DROPLET_ID=$(doctl compute droplet list --format ID,Name --no-header | awk '$2 == "${{ env.DROPLET_NAME }}" {print $1}')
          if [ -z "$DROPLET_ID" ]; then
            echo "Creating Droplet..."
            DROPLET_ID=$(doctl compute droplet create ${{ env.DROPLET_NAME }} --region ${{ env.DIGITALOCEAN_REGION }} --size ${{ env.DROPLET_SIZE }} --image ${{ env.DROPLET_IMAGE }} --format ID --no-header)
            echo "Waiting for Droplet to become active..."
            sleep 60
          else
            echo "Droplet exists: $DROPLET_ID"
          fi

          DROPLET_IP=$(doctl compute droplet get $DROPLET_ID --format PublicIPv4 --no-header)
          echo "DROPLET_IP=$DROPLET_IP" >> $GITHUB_ENV
          echo "DROPLET_ID=$DROPLET_ID" >> $GITHUB_ENV

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.DROPLET_SSH_PRIVATE_KEY }}

      - name: Install Docker & Certbot on Droplet
        run: |
            ssh -o StrictHostKeyChecking=no root@${{ env.DROPLET_IP }} "
            apt-get update -y &&
            apt-get install -y docker.io docker-compose nginx certbot python3-certbot-nginx &&
            usermod -aG docker root &&
            systemctl enable docker &&
            systemctl start docker"

      - name: Docker Login to DigitalOcean Container Registry
        run: echo "${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}" | docker login registry.digitalocean.com -u doctl --password-stdin

      - name: Build and Push Docker Image
        run: |
          IMAGE_TAG=${{ github.sha }}
          docker build -t ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE }}:$IMAGE_TAG .
          docker push ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE }}:$IMAGE_TAG
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Copy .env file
        run: |
          echo "${{ secrets.DATABASE }}" > .env
          echo "MYSQL_HOST=${{ secrets.MYSQL_HOST }}" >> .env
          echo "MYSQL_USER=${{ secrets.MYSQL_USER }}" >> .env
          echo "MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}" >> .env
          echo "MYSQL_DB=${{ secrets.MYSQL_DB }}" >> .env
          echo "EXP_TIME=${{ secrets.EXP_TIME }}" >> .env
          echo "JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}" >> .env

          echo "S3_ACCESS_KEY=${{ secrets.S3_ACCESS_KEY }}" >> .env
          echo "S3_SECRET_KEY=${{ secrets.S3_SECRET_KEY }}" >> .env
          echo "AWS_REGION=${{ secrets.AWS_REGION }}" >> .env
          echo "BUCKET_NAME=${{ secrets.BUCKET_NAME }}" >> .env

      - name: Transfer .env file to Droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.DROPLET_IP }}
          username: root
          key: ${{ secrets.DROPLET_SSH_PRIVATE_KEY }}
          port: ${{ env.SSH_PORT }}
          source: .env
          target: /root/.env
          strip_components: 0

      - name: Deploy to Droplet and Setup Systemd Service
        run: |
          ssh -o StrictHostKeyChecking=no root@${{ env.DROPLET_IP }} "
            docker pull ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE }}:${{ env.IMAGE_TAG }}
            
            cat << EOF > /etc/systemd/system/${{ env.CONTAINER_NAME }}.service
            [Unit]
            Description=EMR API Container
            After=network.target docker.service
            Requires=docker.service

            [Service]
            Restart=always
            ExecStartPre=-/usr/bin/docker stop ${{ env.CONTAINER_NAME }}
            ExecStartPre=-/usr/bin/docker rm ${{ env.CONTAINER_NAME }}
            ExecStart=/usr/bin/docker run --rm --name ${{ env.CONTAINER_NAME }} --env-file /root/.env -p ${{ env.APP_PORT }}:${{ env.APP_PORT }} ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE }}:${{ env.IMAGE_TAG }}
            ExecStop=/usr/bin/docker stop ${{ env.CONTAINER_NAME }}

            [Install]
            WantedBy=multi-user.target
            EOF

            systemctl daemon-reload && systemctl enable ${{ env.CONTAINER_NAME }} && systemctl start ${{ env.CONTAINER_NAME }} "

      - name: Setup Nginx Reverse Proxy
        run: |
              ssh -o StrictHostKeyChecking=no root@${{ env.DROPLET_IP }} "
                cat << EOF > /etc/nginx/sites-available/emrapi
                server {
                    listen 80;
                    server_name ${{ env.DOMAIN_NAME }};

                    location / {
                        proxy_pass http://localhost:${{ env.APP_PORT }};
                        proxy_set_header Host \$host;
                        proxy_set_header X-Real-IP \$remote_addr;
                        proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                        proxy_set_header X-Forwarded-Proto \$scheme;
                    }
                }
                EOF
                rm /etc/nginx/sites-enabled/default && ln -s /etc/nginx/sites-available/emrapi /etc/nginx/sites-enabled/ && nginx -t && systemctl restart nginx
              "

      - name: Setup Certbot (HTTPS)
        run: |
          ssh -o StrictHostKeyChecking=no root@${{ env.DROPLET_IP }} "
            certbot --nginx -d ${{ env.DOMAIN_NAME }} --non-interactive --agree-tos -m your-email@example.com
            "

name: Deploy EMR-API Docker App to DigitalOcean Droplet

on:
  workflow_dispatch:
    inputs:
      name:
        description: "Deploy EMR-API from dev"
        default: "dev"

env:
  DIGITALOCEAN_REGION: blr1
  DROPLET_SIZE: s-4vcpu-8gb
  DROPLET_IMAGE: ubuntu-22-04-x64
  DROPLET_NAME: emr-droplet
  DOCKER_REGISTRY: registry.digitalocean.com/emr-repository
  DOCKER_IMAGE: emr-api
  SSH_PORT: 22
  APP_PORT: 5000
  CONTAINER_NAME: emrapi
  DOMAIN_NAME: dcrmapi.aaspl.net
  RESERVED_IP: 174.138.120.99

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Authenticate with DigitalOcean
        run: doctl auth init --access-token ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Get or Create DigitalOcean Droplet
        id: droplet
        run: |
          DROPLET_ID=$(doctl compute droplet list --format ID,Name --no-header | awk '$2 == "${{ env.DROPLET_NAME }}" {print $1}')
          if [ -z "$DROPLET_ID" ]; then
            echo "Creating Droplet..."
            DROPLET_ID=$(doctl compute droplet create ${{ env.DROPLET_NAME }} --region ${{ env.DIGITALOCEAN_REGION }} --size ${{ env.DROPLET_SIZE }} --image ${{ env.DROPLET_IMAGE }} --format ID --no-header --wait)
          else
            echo "Droplet exists: $DROPLET_ID"
          fi

          DROPLET_IP=$(doctl compute droplet get $DROPLET_ID --format PublicIPv4 --no-header)
          echo "DROPLET_IP=$DROPLET_IP" >> $GITHUB_ENV
          echo "DROPLET_ID=$DROPLET_ID" >> $GITHUB_ENV

      - name: Assign Reserved IP to Droplet
        run: |
          echo "Checking existing assignment..."
          ASSIGNED_DROPLET=$(doctl compute reserved-ip get ${{ env.RESERVED_IP }} --format DropletID --no-header || echo "")
          
          if [ "$ASSIGNED_DROPLET" != "${{ env.DROPLET_ID }}" ]; then
            echo "Unassigning reserved IP from old Droplet (if any)..."
            doctl compute reserved-ip-action unassign ${{ env.RESERVED_IP }} || echo "No unassign needed"
            sleep 10

            echo "Assigning reserved IP to current Droplet..."
            doctl compute reserved-ip-action assign ${{ env.RESERVED_IP }} ${{ env.DROPLET_ID }}
          else
            echo "Reserved IP is already assigned to current Droplet."
          fi


      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.DROPLET_SSH_PRIVATE_KEY }}

      - name: Install Docker & Certbot on Droplet
        run: |
          ssh -o StrictHostKeyChecking=no root@${{ env.DROPLET_IP }} "
            apt-get update -y &&
            apt-get install -y docker.io docker-compose nginx certbot python3-certbot-nginx &&
            usermod -aG docker root &&
            systemctl enable docker &&
            systemctl start docker"

      - name: Docker Login to DigitalOcean Container Registry
        run: echo "${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}" | docker login registry.digitalocean.com -u doctl --password-stdin

      - name: Delete old images from DigitalOcean Registry
        run: |
          echo "Deleting old images from the registry..."
          # List images in the registry
          IMAGES=$(doctl registry repository list ${{ env.DOCKER_REGISTRY }} --format Name --no-header)

          # Loop through the images and delete older ones (example logic, you can adjust to your needs)
          for IMAGE in $IMAGES; do
            # Example: delete images with a specific prefix or older than a certain date
            if [[ "$IMAGE" == "your_image_prefix"* ]]; then
              echo "Deleting image: $IMAGE"
              doctl registry repository delete ${{ env.DOCKER_REGISTRY }}/$IMAGE --force
            fi
          done

      - name: Build and Push Docker Image
        run: |
          IMAGE_TAG=${{ github.sha }}
          docker build -t ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE }}:$IMAGE_TAG .
          docker push ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE }}:$IMAGE_TAG
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Create .env file
        run: |
          echo "MYSQL_HOST=${{ secrets.MYSQL_HOST }}" >> .env
          echo "MYSQL_USER=${{ secrets.MYSQL_USER }}" >> .env
          echo "MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}" >> .env
          echo "MYSQL_DB=${{ secrets.MYSQL_DB }}" >> .env
          echo "MYSQL_PORT=${{ secrets.MYSQL_PORT }}" >> .env
          echo "EXP_TIME=${{ secrets.EXP_TIME }}" >> .env
          echo "JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}" >> .env
          echo "S3_ACCESS_KEY=${{ secrets.S3_ACCESS_KEY }}" >> .env
          echo "S3_SECRET_KEY=${{ secrets.S3_SECRET_KEY }}" >> .env
          echo "AWS_REGION=${{ secrets.AWS_REGION }}" >> .env
          echo "BUCKET_NAME=${{ secrets.BUCKET_NAME }}" >> .env

      - name: Transfer .env file to Droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.DROPLET_IP }}
          username: root
          key: ${{ secrets.DROPLET_SSH_PRIVATE_KEY }}
          port: ${{ env.SSH_PORT }}
          source: .env
          target: /root/.env
          strip_components: 0

      - name: Deploy to Droplet and Setup Systemd Service
        run: |
          ssh -o StrictHostKeyChecking=no root@${{ env.DROPLET_IP }} "
            echo '${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}' | docker login registry.digitalocean.com -u doctl --password-stdin
            docker system prune -af --volumes || true
            docker pull ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE }}:${{ env.IMAGE_TAG }}

            sudo tee /etc/systemd/system/$CONTAINER_NAME.service > /dev/null << SERVICE
            [Unit]
            Description=ConsumeWise API Container 
            After=network.target docker.service
            Requires=docker.service

            [Service]
            Restart=always
            ExecStartPre=-/usr/bin/docker stop ${CONTAINER_NAME} 
            ExecStartPre=-/usr/bin/docker rm ${CONTAINER_NAME} 
            ExecStart=/usr/bin/docker run --rm --name ${CONTAINER_NAME} --env-file /home/ubuntu/.env  -p 5000:5000 ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:$IMAGE_TAG
            ExecStop=/usr/bin/docker stop ${CONTAINER_NAME}

            [Install]
            WantedBy=multi-user.target
            SERVICE

      - name: Enable systemd service on Droplet
        run: |
          ssh -o StrictHostKeyChecking=no root@${{ env.DROPLET_IP }} << EOF
          # Start systemd service
          sudo systemctl daemon-reload
          sudo systemctl enable ${CONTAINER_NAME}
          sudo systemctl start ${CONTAINER_NAME}


      - name: Set up Nginx reverse proxy
        run: |
            ssh -o StrictHostKeyChecking=no root@${{ env.DROPLET_IP }} << EOF
            # Set up Nginx reverse proxy
            sudo bash -c "cat > /etc/nginx/sites-available/${CONTAINER_NAME}" <<'EOL'
            server {
                listen 80;
                server_name $DOMAIN_NAME;
            
                location / {
                    proxy_pass http://localhost:5000;
                    proxy_set_header Host \$host;
                    proxy_set_header X-Real-IP \$remote_addr;
                    proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto \$scheme;
                }
            }
            EOL

      - name: Enable Nginx site and restart (Enable HTTPS)
        run: |
              ssh -o StrictHostKeyChecking=no root@${{ env.DROPLET_IP }} << EOF
              # Enable Nginx site and restart
              sudo rm -f /etc/nginx/sites-enabled/default
              sudo ln -s /etc/nginx/sites-available/${CONTAINER_NAME} /etc/nginx/sites-enabled/
              sudo nginx -t && sudo systemctl restart nginx

              # Request Let's Encrypt SSL Certificate
              sudo certbot --nginx -d  ${{ env.DOMAIN_NAME }} --non-interactive --agree-tos -m appliedsw@aaspl.net
              # Auto-renewal (already set by Certbot via cron or systemd)
